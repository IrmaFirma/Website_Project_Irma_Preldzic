<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Trapped</title>
</head>

<body class="home-page">

    <!-- Doors (opening animation) -->
    <div class="doors">
        <div class="door door-left"></div>
        <div class="door door-right"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="nav-left">
            <a href="index.html" class="active">HOME</a>
            <a href="story.html">STORY</a>
            <a href="team.html">TEAM</a>
        </div>

    </nav>


    <!-- Main Homepage -->
    <main class="home">

        <!-- Left side -->
        <div class="left-side">

            <!-- Film Preview -->
            <section class="film-preview">

                <div class="video-box">

                    <video controls>
                        <source src="assets/trapped.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>

                </div>

                <div class="video-label">

                    <p class="sub">WATCH FILM</p>

                    <span></span>

                </div>

            </section>


            <!-- NYUAD Information -->
            <section class="nyuad-story">

                <div class="nyuad-text">

                    <p class="sub">AN NYUAD PRODUCTION</p>

                    <p>
                        Created at NYU Abu Dhabi, <em>Trapped</em> explores
                        claustrophobia, spatial suspense, and human survival
                        instincts through visual storytelling.
                    </p>

                </div>

            </section>

        </div>


        <!-- Film Information -->
        <header class="film-title">

            <h1>TRAPPED</h1>

            <p class="tagline">
                <em>What if there is no way out?</em>
            </p>

            <div class="genre-box">

                <span>DRAMA</span>
                <span>/</span>
                <span>THRILLER</span>

            </div>

        </header>

    </main>

</body>
</html>
